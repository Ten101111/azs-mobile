<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy for the frontend PWA.
      • script-src: allow Yandex Maps API (loaded dynamically by main.jsx).
      • style-src: 'unsafe-inline' is required because React renders inline style objects.
      • img-src: blob: covers map tiles generated in-memory; https: covers Yandex tile CDN.
      • connect-src: Yandex geocoder and suggest APIs used by the map widget.
      • worker-src: Vite PWA service worker.
      • frame-ancestors is IGNORED inside a <meta> tag — set it in the HTTP response
        header on your nginx/Caddy/reverse-proxy layer instead.
      In production also add the HSTS and X-Frame-Options headers on the static server.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://api-maps.yandex.ru https://yandex.ru https://yastatic.net;
      style-src 'self' 'unsafe-inline' https://yastatic.net;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.yandex.ru https://*.yandex.net https://yastatic.net;
      font-src 'self' data: https://yastatic.net;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self'
    " />
    <meta name="description" content="Классификатор АЗС ЛУКОЙЛ: реестр объектов, карта, аналитика, контроль качества данных и карточки АЗС." />
    <meta name="application-name" content="АЗС ЛУКОЙЛ" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="АЗС" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="АЗС ЛУКОЙЛ | Справочник объектов" />
    <meta property="og:description" content="Реестр, карта, аналитика и контроль качества данных по объектам АЗС." />
    <meta property="og:image" content="/icon-512.png" />
    <title>АЗС | Справочник объектов</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
