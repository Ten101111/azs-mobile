<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мобильный аналитик — орб</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #090A0C; color: #F5F5F3;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .stage { display: grid; place-items: center; align-content: center; gap: 28px; padding: 24px 16px; }
  .orb-wrap { position: relative; width: min(64vmin, 420px); aspect-ratio: 1; }
  .orb { width: 100%; height: 100%; display: block; touch-action: none; }
  .label {
    position: relative; height: 1.4em; font-size: 15px; letter-spacing: 0.01em;
    color: #8A8D92; text-align: center; min-width: 14ch;
  }
  .label span {
    position: absolute; inset: 0; opacity: 0; transform: translateY(6px);
    transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
  }
  .label span.on { opacity: 1; transform: none; }
  .label span.ready { color: #F5F5F3; }
  .label span.bad { color: #8A8D92; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #17191D; background: #0B0D10; min-width: 0;
    transition: opacity .3s, transform .3s;
  }
  .bar.hidden { opacity: 0; transform: translateY(100%); pointer-events: none; }
  button {
    appearance: none; border: 1px solid #23262C; background: #111317; color: #C9CBCF;
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .2s, border-color .2s, color .2s;
  }
  button:hover { background: #17191D; }
  button.active { border-color: #E31E24; color: #F5F5F3; background: #1A1215; }
  button.demo.active { border-color: #F5F5F3; }
  .group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 6px; min-width: 0; }
  .group + .group { border-left: 1px solid #1E2127; }
  .meta { font-size: 11px; color: #5C6067; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .fallback { display: none; width: min(64vmin, 420px); aspect-ratio: 1; }
  .nogl .orb-wrap { display: none; } .nogl .fallback { display: block; }
  @media (max-width: 560px) {
    .group + .group { border-left: 0; }
    button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="orb-wrap"><canvas class="orb" id="orb" aria-label="Орб ИИ-аналитика" role="img"></canvas></div>
    <!-- Запасной знак, если WebGL2 недоступен: тот же орб на SVG -->
    <svg class="fallback" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="31" fill="#17191D"/>
      <circle cx="50" cy="50" r="31" fill="none" stroke="#292C31" stroke-width=".6"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#E31E24" stroke-width="12" stroke-linecap="round" stroke-dasharray="78 186" transform="rotate(-46 50 50)"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#A00A10" stroke-width="12" stroke-linecap="round" stroke-dasharray="62 202" transform="rotate(84 50 50)"/>
      <g fill="#F5F5F3"><rect x="39" y="52" width="6" height="15" rx="2"/><rect x="47" y="44" width="6" height="23" rx="2"/><rect x="55" y="34" width="6" height="33" rx="2"/></g>
    </svg>
    <div class="label" id="label" aria-live="polite"></div>
  </main>

  <nav class="bar" id="bar" aria-label="Проверка состояний">
    <div class="group" id="states"></div>
    <div class="group" id="outcomes"></div>
    <div class="group">
      <button class="demo" id="demo">Демо</button>
      <button id="rm" title="prefers-reduced-motion">Без анимации</button>
      <span class="meta" id="meta"></span>
    </div>
  </nav>

<script type="module">
  import { createOrb, isOrbSupported, ORB_LABELS } from "./orbEngine.js";

  const canvas = document.getElementById("orb");
  const label = document.getElementById("label");
  const bar = document.getElementById("bar");
  const meta = document.getElementById("meta");
  const params = new URLSearchParams(location.search);

  if (!isOrbSupported()) {
    document.body.classList.add("nogl");
    label.innerHTML = '<span class="on">Готов к работе</span>';
  } else {
    const orb = createOrb(canvas, {
      quality: params.get("q") || "auto",
      mode: "dark",
      tapToListen: true,
      reducedMotion: params.has("rm") ? true : "auto",
      onState: (s) => syncUi(s),
    });
    window.orb = orb;                 // для проверки со стенда

    const main = ["idle", "listening", "searching", "analyzing", "forming", "ready"];
    const extra = ["refused", "error"];
    const mk = (id, parent) => {
      const b = document.createElement("button");
      b.textContent = ORB_LABELS[id]; b.dataset.state = id;
      b.onclick = () => { orb.demo.stop(); syncDemo(); orb.setState(id); };
      parent.appendChild(b); return b;
    };
    main.forEach((id) => mk(id, document.getElementById("states")));
    extra.forEach((id) => mk(id, document.getElementById("outcomes")));

    const demoBtn = document.getElementById("demo");
    const syncDemo = () => demoBtn.classList.toggle("active", orb.demo.running);
    demoBtn.onclick = () => { orb.demo.running ? orb.demo.stop() : orb.demo.start(); syncDemo(); };

    const rmBtn = document.getElementById("rm");
    let forcedRm = params.has("rm");
    const syncRm = () => rmBtn.classList.toggle("active", orb.reducedMotion);
    rmBtn.onclick = () => { forcedRm = !forcedRm; orb.setReducedMotion(forcedRm ? true : "auto"); syncRm(); };

    function syncUi(s) {
      document.querySelectorAll("button[data-state]").forEach((b) => b.classList.toggle("active", b.dataset.state === s));
      const span = document.createElement("span");
      span.textContent = ORB_LABELS[s];
      span.className = s === "ready" ? "ready" : (s === "refused" || s === "error" ? "bad" : "");
      label.querySelectorAll("span").forEach((old) => { old.classList.remove("on"); setTimeout(() => old.remove(), 500); });
      label.appendChild(span);
      requestAnimationFrame(() => span.classList.add("on"));
    }
    syncUi("idle"); syncRm();

    // «h» прячет панель: критерий качества — орб один на чёрном
    addEventListener("keydown", (e) => { if (e.key === "h") bar.classList.toggle("hidden"); });
    if (params.has("bare")) bar.classList.add("hidden");

    setInterval(() => { meta.textContent = `${orb.quality} · ${Math.round(orb.fps)} к/с`; }, 1000);

    const s = params.get("state");
    if (s) orb.setState(s);
    if (params.has("demo")) { orb.demo.start(); syncDemo(); }
  }
</script>
</body>
</html>
